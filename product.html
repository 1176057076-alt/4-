<script src='script.js'></script><script>const map={serum:{name:'Prism Serum',price:329,desc:'高效提亮、强韧屏障。',img:'assets/product-1.svg',cat:'护肤精华'},foundation:{name:'Velvet Foundation',price:269,desc:'柔焦底妆，轻薄贴肤。',img:'assets/product-2.svg',cat:'底妆'},tint:{name:'Cloud Tint',price:189,desc:'高级低饱和显色。',img:'assets/product-3.svg',cat:'彩妆'}};const id=new URLSearchParams(location.search).get('id')||'serum';const p=map[id];pname.textContent=p.name;pprice.textContent='¥'+p.price;pdesc.textContent=p.desc;pimg.src=p.img;pcat.textContent=p.cat;padd.dataset.add=JSON.stringify({id,name:p.name,price:p.price});padd.addEventListener('click',()=>{const c=JSON.parse(localStorage.getItem('lumea_cart_v1')||'[]');const f=c.find(i=>i.id===id);if(f)f.qty++;else c.push({id,name:p.name,price:p.price,qty:1});localStorage.setItem('lumea_cart_v1',JSON.stringify(c));location.href='checkout.html';});</script></body></html>
